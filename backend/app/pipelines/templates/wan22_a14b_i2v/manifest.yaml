id: wan22_a14b_i2v
task: image_to_video
label: Wan 2.2 A14B I2V (quality)
family: wan22_a14b
description: Quality image-to-video with Wan 2.2 I2V A14B (high + low noise experts, GGUF Q4). 480p-720p @16fps.
badges:
- Quality
- GGUF
requires: []
params:
  prompt:
    node: '6'
    input: text
    type: text
    required: true
    placeholder: Describe the motion
  negative:
    node: '7'
    input: text
    type: text
    advanced: true
    default: low quality, blurry, distorted, watermark, static, no motion
  image:
    node: '20'
    input: image
    type: image
  width:
    node: '5'
    input: width
    type: int
    multiple_of: 16
    default: 832
    min: 256
    max: 1280
  height:
    node: '5'
    input: height
    type: int
    multiple_of: 16
    default: 480
    min: 144
    max: 720
  frames:
    node: '5'
    input: length
    type: int
    rule: 4n+1
    default: 81
    min: 17
    max: 81
  steps:
    nodes:
    - '3'
    - '10'
    input: steps
    type: int
    default: 20
    min: 4
    max: 40
    advanced: true
    split_at:
    - 3.end_at_step
    - 10.start_at_step
  cfg:
    nodes:
    - '3'
    - '10'
    input: cfg
    type: float
    default: 3.5
    min: 1.0
    max: 15.0
    advanced: true
  fps:
    node: '26'
    input: frame_rate
    type: int
    default: 16
    min: 8
    max: 30
    advanced: true
  seed:
    node: '3'
    input: noise_seed
    type: seed
lora_points:
- after: '1'
  model_only: true
- after: '11'
  model_only: true
outputs:
- node: '26'
  kind: video
tiers:
  480p:
    w: 832
    h: 480
    frames: 81
    vram_gb: 10.5
  720p:
    w: 1280
    h: 720
    frames: 49
    vram_gb: 11.8
fallback:
- 480p
